# homer-unificado-ip.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: default
data:
  config.yml: |
    title: "Homelab JLC"
    subtitle: "Panel de Control de Infraestructura"
    columns: "3"
    connectivityTest: true
    defaults:
      layout: "columns"
      theme: "default"
    
    services:
      - name: "Infraestructura"
        icon: "fas check-double"
        items:
          - name: "ArgoCD"
            subtitle: "Despliegue GitOps"
            tag: "infra"
            url: "http://100.102.120.122:80" # Ajusta el puerto si ArgoCD usa otro
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/argo-cd.png"
          - name: "Homer"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/homer.png"
            subtitle: "Este Dashboard"
            tag: "infra"
            url: "http://100.102.120.122"
      - name: "Servicios"
        icon: "fas network-wired"
        items:
          - name: "Nextcloud"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/nextcloud.png"
            subtitle: "Nube Privada & Almacenamiento"
            tag: "app"
            url: "http://100.102.120.122" # Traefik redirigirá esto según el path o host si es necesario
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/nextcloud.png"
          - name: "Trilium Notes"
            logo: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/trilium.png"
            subtitle: "Base de Conocimiento Personal"
            tag: "app"
            url: "http://100.102.120.122"
---
# (El resto del archivo sigue igual: Deployment, Service e Ingress)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homer
  template:
    metadata:
      labels:
        app: homer
    spec:
      containers:
      - name: homer
        image: b4bz/homer:latest
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /www/assets/config.yml
          subPath: config.yml
      volumes:
      - name: config-volume
        configMap:
          name: homer-config
---
apiVersion: v1
kind: Service
metadata:
  name: homer-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: homer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homer-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: homer.jlc.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homer-service
            port:
              number: 80
