apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homer
  template:
    metadata:
      labels:
        app: homer
    spec:
      containers:
      - name: homer
        image: b4bz/homer:latest
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /www/assets/config.yml
          subPath: config.yml
      volumes:
      - name: config-volume
        configMap:
          name: homer-config
---
apiVersion: v1
kind: Service
metadata:
  name: homer-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: homer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homer-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"  # Mapea con el Traefik nativo de K3s
spec:
  rules:
  - host: homer.jlc.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homer-service
            port:
              number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: default
data:
  config.yml: |
    title: "Homelab JLC - TFG"
    subtitle: "Panel de Control de Infraestructura"
    columns: "3"
    connectivityTest: true
    defaults:
      layout: "columns"
      theme: "default"
    
    services:
      - name: "Infraestructura & Control"
        icon: "fas fa-network-wired"
        items:
          - name: "ArgoCD"
            icon: "fas fa-ship"
            subtitle: "Despliegue GitOps"
            url: "http://argocd.jlc.local"
          - name: "MinIO Object Store"
            icon: "fas fa-hdd"
            subtitle: "Almacenamiento de Backups"
            url: "http://minio.jlc.local"  # Cambia por tu dominio/IP de acceso a la consola si es diferente

      - name: "Bases de Datos"
        icon: "fas fa-database"
        items:
          - name: "Postgres Cluster"
            icon: "fas fa-server"
            subtitle: "CloudNativePG (homelab-db)"
            url: "#"

      - name: "Servicios IT"
        icon: "fas fa-cubes"
        items:
          - name: "Homer"
            icon: "fas fa-home"
            subtitle: "Este Dashboard"
            url: "http://homer.jlc.local"
