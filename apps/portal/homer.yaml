apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: default
data:
  config.yml: |
    title: "Homelab JLC"
    subtitle: "Panel de Control de Infraestructura"
    columns: "4"
    connectivityTest: true
    defaults:
      layout: "columns"
      theme: "default"
    
    services:
      - name: "Infraestructura"
        icon: "fas fa-cogs"
        items:
          - name: "ArgoCD"
            subtitle: "Despliegue GitOps"
            tag: "infra"
            url: "http://argocd.jlc.local"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/argo-cd.png"
            
          - name: "Homer"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/homer.png"
            subtitle: "Este Dashboard"
            tag: "infra"
            url: "http://homer.jlc.local"
      
      - name: "Servicios"
        icon: "fas fa-network-wired"
        items:
          - name: "Nextcloud"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/nextcloud.png"
            subtitle: "Nube Privada"
            tag: "app"
            url: "http://http://nextcloud.jlc.local"
          - name: "Trilium Notes"
            logo: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/trilium.png"
            subtitle: "Base de Conocimiento"
            tag: "app"
            url: "http://trilium.jlc.local"
          - name: "Jellyfin"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/jellyfin.png"
            subtitle: "Media Server"
            tag: "media"
            url: "http://jellyfin.jlc.local"
          - name: "Vaultwarden"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/vaultwarden.png"
            subtitle: "Gestor de Contraseñas"
            tag: "security"
            url: "https://vaultwarden.jlc.local"
          - name: "IT-Tools"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/it-tools.png"
            subtitle: "Herramientas de Red"
            tag: "tools"
            url: "http://it-tools.jlc.local"

      - name: "Monitorización"
        icon: "fas fa-chart-line"
        items:
          - name: "Grafana"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/grafana.png"
            subtitle: "Visualización de métricas"
            tag: "monitor"
            url: "http://grafana.jlc.local"
          - name: "Uptime Kuma"
            logo: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/uptime-kuma.png"
            subtitle: "Monitor de estado"
            tag: "monitor"
            url: "http://uptime.jlc.local"
            
      - name: "Móvil"
        icon: "fas fa-mobile-alt"
        items:
          - name: "Nextcloud"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/nextcloud.png"
            subtitle: "Acceso a Archivos"
            tag: "mobile"
            url: "http://10.43.209.85"
          - name: "Trilium Notes"
            logo: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/trilium.png"
            subtitle: "Notas Rápidas"
            tag: "mobile"
            url: "http://10.43.106.212"
          - name: "IT-Tools"
            logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@master/png/it-tools.png"
            subtitle: "Utilidades de Red"
            tag: "mobile"
            url: "http://10.43.58.242"
      
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: PostSync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homer
  template:
    metadata:
      annotations:
        timestamp: "2026-05-22T00:00:00Z"
      labels:
        app: homer
    spec:
      containers:
      - name: homer
        image: b4bz/homer:latest
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /www/assets/config.yml
          subPath: config.yml
      volumes:
      - name: config-volume
        configMap:
          name: homer-config
---
apiVersion: v1
kind: Service
metadata:
  name: homer-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: homer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homer-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: homer.jlc.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homer-service
            port:
              number: 80
