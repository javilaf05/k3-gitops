apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
spec:
  project: default
  source:
  chart: tailscale-operator
  repoURL: https://pkgs.tailscale.com/helmcharts
  helm:
      values: |
        operatorConfig:
          apiServerProxyConfig:
            mode: "true"
          clientAuth:
            secretName: "tailscale-auth"
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
