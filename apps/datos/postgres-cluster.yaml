apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homelab-db-cluster
  namespace: default
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 3Gi
    storageClass: local-path
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/
      endpointURL: http://minio-service.default.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: minio-creds
          key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
