apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: https://crowdsecurity.github.io/helm-charts
    targetRevision: 0.12.0 
    chart: crowdsec
    helm:
      values: |
        agent:
          enabled: true
        bouncer:
          enabled: true
          kind: traefik
          traefik:
            enabled: true
        acquisition:
          - source: docker
            container_name:
              - traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
