apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      initContainers:
      - name: init-permissions
        image: ghcr.io/linuxserver/nextcloud:latest
        command: ["sh", "-c", "chown -R 911:911 /config"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: nextcloud-config
          mountPath: /config
      containers:
      - name: nextcloud
        image: ghcr.io/linuxserver/nextcloud:latest
        ports:
        - containerPort: 443
          name: https
        env:
        - name: PUID
          value: "911"
        - name: PGID
          value: "911"
        - name: TZ
          value: Europe/Madrid
        - name: POSTGRES_HOST
          value: homelab-db-cluster-rw.default.svc.cluster.local
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud_user
        - name: POSTGRES_PASSWORD
          value: nextcloud_password
        - name: OBJECTSTORE_S3_HOST
          value: minio-service.default.svc.cluster.local
        - name: OBJECTSTORE_S3_PORT
          value: "9000"
        - name: OBJECTSTORE_S3_BUCKET
          value: nextcloud-data
        - name: OBJECTSTORE_S3_KEY
          value: minio_user_tfg
        - name: OBJECTSTORE_S3_SECRET
          value: minio_password_tfg
        - name: OBJECTSTORE_S3_SSL
          value: "false"
        - name: OBJECTSTORE_S3_REGION
          value: us-east-1
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
        volumeMounts:
        - name: nextcloud-config
          mountPath: /config
      volumes:
      - name: nextcloud-config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-service
  namespace: default
spec:
  ports:
  - port: 443
    targetPort: https
    protocol: TCP
  selector:
    app: nextcloud
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # CORRECCIÓN: Sintaxis limpia y oficial para Traefik
    traefik.ingress.kubernetes.io/service.serverstransport: "insecureskipverify@file"
spec:
  rules:
  - host: nextcloud.jlc.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nextcloud-service
            port:
              number: 443
