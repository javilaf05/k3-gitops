apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-pvc        # NUEVO: Creamos el "disco virtual"
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path  # El storage class nativo de K3s
  resources:
    requests:
      storage: 10Gi          # Espacio asignado (puedes cambiarlo si quieres)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
      - name: nextcloud
        image: nextcloud:latest
        ports:
        - containerPort: 80
          name: http
        # -------------------------------------------------------------
        volumeMounts:        # NUEVO: Conectamos el disco dentro del contenedor
        - name: nextcloud-data
          mountPath: /var/www/html # La ruta crítica que antes era volátil
        # -------------------------------------------------------------
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
      # ---------------------------------------------------------------
      volumes:               # NUEVO: Declaramos el volumen en el pod
      - name: nextcloud-data
        persistentVolumeClaim:
          claimName: nextcloud-pvc
      # ---------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: nextcloud
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: nextcloud.jlc.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nextcloud-service
            port:
              number: 80
