apiVersion: apps/v1
kind: Deployment
metadata:
  name: silverbullet
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: silverbullet
  template:
    metadata:
      labels:
        app: silverbullet
    spec:
      containers:
      - name: silverbullet
        image: zefhemel/silverbullet:latest
        ports:
        - containerPort: 3000
          name: http
        command: ["silverbullet", "/space"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: silverbullet-space
          mountPath: /space
      volumes:
      - name: silverbullet-space
        persistentVolumeClaim:
          claimName: silverbullet-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silverbullet-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path 
  resources:
    requests:
      storage: 2Gi 
---
apiVersion: v1
kind: Service
metadata:
  name: silverbullet-service
  namespace: default
spec:
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
  selector:
    app: silverbullet
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: silverbullet-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: notes.jlc.local 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: silverbullet-service
            port:
              number: 3000
