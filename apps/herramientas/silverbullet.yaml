apiVersion: apps/v1
kind: Deployment
metadata:
  name: silverbullet
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: silverbullet
  template:
    metadata:
      labels:
        app: silverbullet
    spec:
      containers:
      - name: silverbullet
        image: quay.io/silverbulletdb/silverbullet:latest
        command: ["silverbullet", "listen", "--port", "3000", "/space"]
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PURGE_EVERYWHERE
          value: "true"
        volumeMounts:
        - name: space-data
          mountPath: /space
      volumes:
      - name: space-data
        persistentVolumeClaim:
          claimName: silverbullet-pvc
            port:
              number: 80
