apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trilium-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trilium
  template:
    metadata:
      labels:
        app: trilium
    spec:
      containers:
      - name: trilium
        image: zadam/trilium:0.63-latest
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: trilium-data
          mountPath: /home/node/trilium-data
      volumes:
      - name: trilium-data
        persistentVolumeClaim:
          claimName: trilium-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: trilium-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: trilium
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trilium-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: wiki.jlc.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: trilium-service
            port:
              number: 80
