apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitorizacion
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: victoriametrics-metrics-datasource
        type: prometheus
        url: http://vm-metrics-prod-victoria-metrics-single-server.monitorizacion.svc.cluster.local:8428
        access: proxy
      - name: victoriametrics-logs-datasource
        type: grafana-victorialogs-datasource
        url: http://victorialogs-victoria-logs-single-server.monitorizacion.svc.cluster.local:9428
        access: proxy
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitorizacion
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: grafanaport
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "1234"
        - name: GF_INSTALL_PLUGINS
          value: "grafanacloud-talend-datasource,victoriametrics-datasource,victorialogs-datasource"
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources/
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitorizacion
spec:
  selector:
    app: grafana
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitorizacion
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: grafana.jlc.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 80
