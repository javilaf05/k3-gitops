apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    targetRevision: 60.0.0
    chart: kube-prometheus-stack
    helm:
      values: |
        grafana:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 10Gi
        serviceMonitorSelectorNilUsesHelmValues: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitorizacion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # <--- ESTA ES LA CLAVE
