apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent-sa
  namespace: monitorizacion
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmagent-role
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/metrics", "nodes/proxy", "pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmagent-binding
subjects:
- kind: ServiceAccount
  name: vmagent-sa
  namespace: monitorizacion
roleRef:
  kind: ClusterRole
  name: vmagent-role
  apiGroup: rbac.authorization.k8s.io
