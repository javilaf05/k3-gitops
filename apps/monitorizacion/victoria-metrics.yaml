apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-config
  namespace: monitorizacion
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        # ... (resto de tu configuración de scrape_configs)
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics-bridge
  namespace: monitorizacion
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8428
    targetPort: 8428
    protocol: TCP
  selector:
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: victoria-metrics-single
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victorialogs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-logs-single
    targetRevision: 0.12.4
    helm:
      values: |
        persistence:
          enabled: true
          size: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitorizacion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
