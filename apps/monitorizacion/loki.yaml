apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitorizacion
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        args:
        - "-config.file=/etc/loki/local-config.yaml"
        ports:
        - containerPort: 3100
          name: http-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: loki-service
  namespace: monitorizacion
spec:
  selector:
    app: loki
  ports:
  - port: 3100
    targetPort: 3100
    protocol: TCP
    name: loki-port
