apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.0.0
    helm:
      values: |
        loki:
          auth_enabled: false
          storage:
            type: 's3'
            s3:
              endpoint: http://minio.minio.svc.cluster.local:9000  # Cambia esto por la URL interna de tu servicio MinIO
              bucketnames: loki-logs
              access_key_id: minioadmin
              secret_access_key: minioadmin
              s3forcepathstyle: true
              insecure: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitorizacion 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
