apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: uptime-kuma-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uptime-kuma
  minReplicaCount: 0   
  maxReplicaCount: 3   
  cooldownPeriod: 600  
  pollingInterval: 30  
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://victoria-metrics-victoria-metrics-single-server.monitorizacion.svc.cluster.local:8428
      metricName: traefik_service_requests_total
      query: sum(rate(traefik_service_requests_total{service=~"uptime-kuma-service.*"}[5m]))
      threshold: '1'
