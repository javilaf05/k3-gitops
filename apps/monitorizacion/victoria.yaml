apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-config
  namespace: monitorizacion
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # 1. Solo escrapea pods que tengan la anotación: prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          
          # 2. Usa el path definido en la anotación, si existe, si no usa /metrics
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
            replacement: $1
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: drop
            regex: ^$
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: ^$
            replacement: /metrics

          # 3. GARANTIZAR UNICIDAD: La etiqueta 'instance' será 'nombre-del-pod:puerto'
          # Esto evita que dos puertos del mismo pod tengan la misma etiqueta.
          - source_labels: [__meta_kubernetes_pod_name, __meta_kubernetes_pod_container_port_number]
            action: replace
            target_label: instance
            separator: ':'
          
          # 4. Etiquetas de Kubernetes estándar
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics-bridge
  namespace: monitorizacion
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8428
    targetPort: 8428
