apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScraper
metadata:
  name: k3s-nodes-scraper
  namespace: monitorizacion
spec:
  interval: 15s
  path: /metrics
  relabelConfigs:
  - action: labelmap
    regex: __meta_kubernetes_node_label_(.+)
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScraper
metadata:
  name: traefik-ingress-scraper
  namespace: monitorizacion
spec:
  podMetricsEndpoints:
  - port: metrics # Apunta al puerto de métricas expuesto por Traefik
    interval: 15s
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
